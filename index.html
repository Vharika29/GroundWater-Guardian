<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groundwater Guardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 antialiased">
    <header id="main-header" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white p-4 shadow-xl flex flex-col sm:flex-row items-center justify-between rounded-b-lg transition-colors duration-300">
        <div class="flex items-center mb-2 sm:mb-0">
            <img src="water.avif" class="w-10 h-10 mr-3 rounded-full">
            <h1 class="text-3xl font-bold">Groundwater Guardian</h1>
        </div>
        <nav class="flex items-center space-x-4">
            <div id="profile-area">
                <button id="create-profile-button" class="bg-white text-blue-700 px-4 py-2 rounded-full font-semibold hover:bg-blue-100 transition-all duration-300 shadow-md flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    Create Profile
                </button>
            </div>
            <button id="dark-mode-toggle" class="px-3 py-2 rounded-full font-semibold transition-all duration-300 shadow-md bg-blue-700 text-white hover:bg-blue-800" aria-label="Toggle Dark Mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-gray-900">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3.51a.75.75 0 0 1 .15.89c.17.36.43.68.74.92A6.5 6.5 0 0 0 15 13a6.5 6.5 0 0 0 6-6.5z"/>
                </svg>
            </button>
        </nav>
    </header>

    <main id="app-content" class="flex-grow"></main>

    <script src="quizData.js"></script>
    <script src="script.js"></script>
</body>
</html>
